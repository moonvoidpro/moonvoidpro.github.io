name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # 或者你使用的默认分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.BOOK_BLOG }}  # 使用 GitHub Secret 进行授权
          publish_dir: ./public  # 发布 Hugo 构建的文件夹

